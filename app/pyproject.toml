[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-agent-harness"
version = "0.1.0"
description = "Deterministic tax-agent harness foundation for the Cloud Accounting track"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chainlit==2.12.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langchain==1.4.4",
    "langchain-core==1.6.9",
    "langchain-openai==1.7.0",
    "langgraph==1.2.14",
    "langgraph-checkpoint-sqlite==3.1.1",
    "openpyxl==3.1.5",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"taxharness.enterprise" = ["static/*.html"]
