<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>企业票据工作台</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#17212b;background:#f4f7fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:9px 13px;background:#176b63;color:white}button.secondary{background:#e7efed;color:#174c47}button.danger{background:#a83b3b}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{border:1px solid #ccd5dc;border-radius:7px;padding:9px;background:white;color:#17212b;max-width:100%}textarea{min-height:90px;width:100%;resize:vertical}label{display:grid;gap:5px;font-size:13px;color:#44515e}form{display:grid;gap:12px}.hidden{display:none!important}.shell{max-width:1440px;margin:auto;padding:18px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #dde4e8;padding:12px 22px;position:sticky;top:0;z-index:4}.brand{font-weight:750;font-size:18px;color:#145e57}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0}.tabs button{white-space:nowrap;background:#e6ecef;color:#33434d}.tabs button.active{background:#176b63;color:#fff}.panel{background:#fff;border:1px solid #e1e6e9;border-radius:12px;padding:17px;margin:12px 0;box-shadow:0 1px 2px #0b1b2a08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#60717c;font-size:13px}.note{padding:10px 12px;background:#edf5f3;border-left:3px solid #208477;border-radius:6px}.error{background:#fff0ef;border-left-color:#b83b35}.good{color:#146c43}.warn{color:#985d00}.status{display:inline-block;border-radius:99px;background:#ecf0f2;padding:3px 9px;font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #edf0f2;vertical-align:top}th{background:#f7f9fa;position:sticky;top:0}.compact button{padding:6px 9px;font-size:12px}.stack{display:grid;gap:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{border:1px solid #e1e7ea;border-radius:9px;padding:12px}.auth{max-width:470px;margin:9vh auto}.auth h1{margin-top:0}.wide{grid-column:1/-1}.pagination{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}.login-mark{font-size:26px;margin-bottom:8px}.inline{display:inline-flex;gap:6px;align-items:center}.checklist{display:grid;gap:6px}.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:14px}@media(max-width:780px){.split{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.shell{padding:10px}.panel{padding:12px}}
    .exportLink{display:inline-block;padding:9px 13px;border-radius:8px;background:#176b63;color:#fff;text-decoration:none;font-weight:650}
    .assistant-log{display:grid;gap:10px;max-height:340px;overflow:auto;margin:12px 0}.assistant-turn{border:1px solid #e1e7ea;border-radius:9px;padding:11px}.assistant-turn p{white-space:pre-wrap;margin:6px 0 12px}.assistant-turn p:last-child{margin-bottom:0}.assistant-turn strong{color:#176b63;font-size:13px}
  </style>
</head>
<body>
  <div id="auth" class="shell auth hidden">
    <div class="panel">
      <div class="login-mark">▧ 企业票据工作台</div>
      <div id="authNotice" class="note hidden"></div>
      <form id="setupForm" class="hidden">
        <h2>首次设置管理员</h2>
        <label>登录账号<input name="username" autocomplete="username" required minlength="3"></label>
        <label>显示名称<input name="display_name" required></label>
        <label>密码（至少 12 个字符）<input name="password" type="password" autocomplete="new-password" required minlength="12"></label>
        <button>创建管理员并登录</button>
      </form>
      <form id="loginForm" class="hidden">
        <h2>登录</h2>
        <label>登录账号<input name="username" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <button>登录工作台</button>
      </form>
    </div>
  </div>
  <div id="app" class="hidden">
    <header class="top">
      <div class="brand">▧ 企业票据工作台</div>
      <div class="toolbar"><label>办理企业<select id="companySelect"></select></label><span id="userLabel" class="muted"></span><button id="logout" class="secondary">退出</button></div>
    </header>
    <main class="shell">
      <nav class="tabs" id="tabs">
        <button data-view="work" class="active">工作清单</button><button data-view="professional">专业复核</button><button data-view="requests">补充请求</button><button data-view="import">导入数据</button>
        <button data-view="rules">规则</button><button data-view="preferences">偏好</button><button data-view="admin">账号与企业</button><button data-view="diagnostics">诊断与备份</button>
      </nav>
      <section id="view-work" class="view"></section><section id="view-requests" class="view hidden"></section>
      <section id="view-professional" class="view hidden"></section><section id="view-import" class="view hidden"></section><section id="view-rules" class="view hidden"></section>
      <section id="view-preferences" class="view hidden"></section><section id="view-admin" class="view hidden"></section>
      <section id="view-diagnostics" class="view hidden"></section>
      <div id="toast" class="panel hidden"></div>
    </main>
  </div>
<script>
(() => {
  let requestReturnTask=null,requestPollTimer=null;
  let user=null, csrf="", companies=[], companyId="", workPage=1, workPages=1, selectedTask=null, selectedRequest=null, taskPage=1, taskPages=1, importPreview=null, importScan=null, professionalImpactNotice=null, contextGeneration=0;
  const $=id=>document.getElementById(id), h=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const toast=(text,error=false)=>{const el=$("toast");el.textContent=text;el.className="panel "+(error?"note error":"note");setTimeout(()=>el.classList.add("hidden"),6500)};
  const companyQuery=()=>companyId?`company_id=${encodeURIComponent(companyId)}`:"";
  const staleContext=()=>Object.assign(new Error("页面身份或企业已切换，已丢弃旧请求结果。"),{name:"StaleContextError"});
  function clearSensitiveUI(){contextGeneration++;clearTimeout(requestPollTimer);selectedTask=null;selectedRequest=null;requestReturnTask=null;workPage=1;taskPage=1;importPreview=null;importScan=null;professionalImpactNotice=null;document.querySelectorAll(".view").forEach(view=>view.replaceChildren());const notice=$("toast");notice.replaceChildren();notice.className="panel hidden"}
  async function api(path, options={}){
    const generation=contextGeneration,actorId=user?.user_id||null,requestCompany=companyId;
    const method=(options.method||"GET").toUpperCase(), headers={...(options.headers||{})};
    if(method!=="GET"&&method!=="HEAD"){headers["X-CSRF-Token"]=csrf;if(!(options.body instanceof FormData))headers["Content-Type"]="application/json";}
    const response=await fetch(path,{credentials:"same-origin",...options,method,headers});
    if(generation!==contextGeneration||actorId!==(user?.user_id||null)||requestCompany!==companyId)throw staleContext();
    if(response.status===401){showAuth(false);throw new Error("登录已过期，请重新登录。")}
    if(!response.ok){let body={};try{body=await response.json()}catch{}throw new Error(body.detail||`请求失败 (${response.status})`)}
    return response;
  }
  async function json(path, options={}){const generation=contextGeneration,actorId=user?.user_id||null,requestCompany=companyId;const r=await api(path,options);const value=await r.json();if(generation!==contextGeneration||actorId!==(user?.user_id||null)||requestCompany!==companyId)throw staleContext();return value}
  const body=value=>JSON.stringify(value);
  const roleFor=company=>user?.is_admin?"admin":(companies.find(item=>item.company_id===company)?.role||"");
  const canAccount=company=>["accountant","admin"].includes(roleFor(company));
  const canReview=company=>["reviewer","admin"].includes(roleFor(company));
  function showAuth(setup){clearSensitiveUI();$("app").classList.add("hidden");$("auth").classList.remove("hidden");$("setupForm").classList.toggle("hidden",!setup);$("loginForm").classList.toggle("hidden",setup);}
  async function start(){try{const setup=await json("/api/setup/status");if(!setup.admin_configured){showAuth(true);return}try{const state=await json("/api/session");csrf=state.csrf_token;user=state.user;companies=state.companies;enter()}catch{showAuth(false)}}catch(e){showAuth(false);$("authNotice").textContent=e.message;$("authNotice").classList.remove("hidden")}}
  function enter(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("userLabel").textContent=`${user.display_name} · ${user.is_admin?"管理员":user.username}`;companies=companies||[];const select=$("companySelect");select.innerHTML=`<option value="">全部授权客户</option>`+companies.map(c=>`<option value="${h(c.company_id)}">${h(c.name)} · ${h(c.default_currency)}</option>`).join("");companyId=companies.length===1?companies[0].company_id:"";select.value=companyId;select.parentElement.classList.toggle("hidden",!companies.length);clearSensitiveUI();select.onchange=()=>{clearSensitiveUI();companyId=select.value;refreshActive()};const requesterHome=!user.is_admin&&!companies.length;document.querySelectorAll(".tabs button").forEach(button=>{button.hidden=requesterHome&&!['requests','preferences'].includes(button.dataset.view)});document.querySelectorAll(".tabs button").forEach(button=>button.classList.toggle("active",button.dataset.view===(requesterHome?"requests":"work")));document.querySelectorAll(".view").forEach(view=>view.classList.toggle("hidden",view.id!==`view-${requesterHome?"requests":"work"}`));refreshActive()}
  async function authSubmit(form,endpoint){const data=Object.fromEntries(new FormData(form).entries());try{const result=await json(endpoint,{method:"POST",body:body(data)});csrf=result.csrf_token;user=result.user;const state=await json("/api/session");csrf=state.csrf_token;companies=state.companies;enter()}catch(e){$("authNotice").textContent=e.message;$("authNotice").className="note error"}}
  $("setupForm").addEventListener("submit",e=>{e.preventDefault();authSubmit(e.currentTarget,"/api/setup/admin")});
  $("loginForm").addEventListener("submit",e=>{e.preventDefault();authSubmit(e.currentTarget,"/api/login")});
  $("logout").onclick=async()=>{try{await json("/api/logout",{method:"POST",body:"{}"})}catch{}csrf="";user=null;companies=[];companyId="";showAuth(false)};
  $("tabs").addEventListener("click",e=>{const button=e.target.closest("button[data-view]");if(!button)return;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===button));document.querySelectorAll(".view").forEach(x=>x.classList.add("hidden"));$("view-"+button.dataset.view).classList.remove("hidden");refreshActive()});
  async function refreshActive(){const active=document.querySelector(".tabs button.active")?.dataset.view||"work";try{if(active==="work")await renderWork();if(active==="professional")await renderProfessional();if(active==="requests")await renderRequests();if(active==="import")await renderImportComplete();if(active==="rules")await renderRulesComplete();if(active==="preferences")await renderPreferencesComplete();if(active==="admin")await renderAdmin();if(active==="diagnostics")await renderDiagnostics()}catch(e){if(e.name!=="StaleContextError")toast(e.message,true)}}
  const taskStatusLabel={open:"待办理",replied:"已回复",cancelled:"已取消",in_progress:"办理中",needs_review:"待复核",returned:"已退回",closed:"已关闭",pending:"待处理",awaiting_info:"待补充",awaiting_review:"待复核",approved:"已通过",waived:"已按授权处置",void:"已作废",proposed:"待会计确认",clarification:"待澄清",unavailable:"无法提供（待处置）",conflict:"版本冲突",superseded:"已由新回复替代",confirmed:"已确认",rejected:"已拒绝"};
  const workStatusLabel=item=>item.status==="needs_review"&&Number(item.resolved_count)>0&&![item.pending_count,item.review_count,item.returned_count].some(Number)?"票据已复核":(taskStatusLabel[item.status]||item.status);
  function draftTicketLabel(d){return d.invoice_refs?.map(ref=>`${ref.source_system} / ${ref.source_invoice_id} · ${ref.seller_name||""} · ${ref.project_name||""}`).join("；")||"待明确票据"}
  const basisStatus={supported:"依据齐全",open:"仍缺依据",conflicting:"依据冲突",awaiting_judgment:"等待判断"};
  function sourceLink(item){if(item.source_type==="source_document")return ` <a target="_blank" rel="noopener" href="/api/source-documents/${encodeURIComponent(item.source_id)}/original">查看原件</a>`;if(item.source_type==="assistant_attachment"&&item.fact_id)return ` <a target="_blank" rel="noopener" href="/api/professional/facts/${encodeURIComponent(item.fact_id)}/source">查看附件</a>`;if(item.kind==="confirmed_attachment_draft")return ` <a target="_blank" rel="noopener" href="/api/attachments/${encodeURIComponent(item.source_id)}/original">查看附件</a>`;return ""}
  function reviewEvidence(invoice){const basis=invoice.review_basis?.professional;if(!basis)return "";const method=invoice.review_basis?.professional_method;const requirements=(basis.requirements||[]).filter(item=>item.required).map(item=>`<li>${h(item.label)}：${item.satisfied?"已满足":"待处理"}</li>`).join("");const sources=(basis.support_groups||[]).map(item=>`<div class="muted">${h(item.fact_text)}：${h(item.source_quote||"暂无原文")}${sourceLink(item)}${item.source_locator?.match_type==="recognized_candidate"?' · 图片识别候选，请核对原件':""}</div>`).join("");return `<details><summary>复核依据：${h(basisStatus[basis.status]||basis.status)}</summary><div class="muted">${h(method?.name||"当前方法")} v${h(method?.version??0)}</div><ul>${requirements}</ul>${sources||'<div class="muted">尚无可查看的支持材料。</div>'}</details>`}
  async function renderWork(){
    const view=$("view-work");if(!companyId&&!companies.length&&!user.is_admin){view.innerHTML='<div class="panel">当前账号没有会计或复核企业授权；请切换到“补充请求”查看经办人任务。</div>';return}
    const period=$("workPeriod")?.value||new Date().toISOString().slice(0,7);
    let items,summary={by_currency:[]},missing;
    if(companyId){[items,summary,missing]=await Promise.all([
      json(`/api/work-items?${companyQuery()}&period=${encodeURIComponent(period)}&page=${workPage}&page_size=25`),
      json(`/api/finance/summary?${companyQuery()}&period=${encodeURIComponent(period)}`),
      json(`/api/missing?${companyQuery()}&period=${encodeURIComponent(period)}&page=1&page_size=100`)
    ])}else{items=await json(`/api/work-items?period=${encodeURIComponent(period)}&page=${workPage}&page_size=25`);missing={status:"ok",missing_count:items.items.reduce((total,item)=>total+Number(item.pending_count||0),0)}}
    workPages=items.pages||1;
    view.innerHTML=`<div class="between"><div><h1>${companyId?"共享工作清单":"所有授权客户 · 共享工作清单"}</h1><div class="muted">${companyId?`缺用途 ${missing.missing_count??"—"} 张 · ${h(missing.policy_summary||missing.rule?.name||missing.summary||"按当前企业规则")}`:`当前页待办理 ${missing.missing_count} 张 · 可按企业或期间筛选`}</div></div><div class="row"><label>期间<input id="workPeriod" type="month" value="${h(period)}"></label>${companyId?'<button id="refreshWork">刷新缺项</button>':''}</div></div>
      ${companyId?`<div class="cards">${(summary.by_currency||[]).map(x=>`<div class="card"><div class="muted">${h(x.currency)} 发票总额</div><strong>${h(x.invoice_total)}</strong><div class="muted">${h(x.invoice_count)} 张</div></div>`).join("")}</div>`:""}
      ${missing.status!=="ok"?`<div class="panel note error">用途规则状态：${h(missing.summary||missing.status)}</div>`:""}
      <div class="panel tablewrap"><table><thead><tr><th>企业</th><th>期间</th><th>票据</th><th>待办</th><th>复核</th><th>退回</th><th>状态</th><th></th></tr></thead><tbody>${items.items.map(x=>`<tr><td>${h(x.company_name)}</td><td>${h(x.period)}</td><td>${h(x.invoice_count)}</td><td>${h(x.pending_count||0)}</td><td>${h(x.review_count||0)}</td><td>${h(x.returned_count||0)}</td><td><span class="status">${h(workStatusLabel(x))}</span></td><td><button class="secondary" data-open-task="${h(x.task_id)}">打开</button></td></tr>`).join("")||'<tr><td colspan="8" class="muted">当前期间没有工作项。</td></tr>'}</tbody></table><div class="pagination"><button id="workPrev" class="secondary" ${workPage<=1?"disabled":""}>上一页</button><span>${workPage} / ${workPages}</span><button id="workNext" class="secondary" ${workPage>=workPages?"disabled":""}>下一页</button></div></div><div id="taskDetail"></div>`;
    $("workPeriod").onchange=()=>{workPage=1;selectedTask=null;renderWork()};if(companyId)$("refreshWork").onclick=()=>renderWork();$("workPrev").onclick=()=>{workPage--;renderWork()};$("workNext").onclick=()=>{workPage++;renderWork()};
    view.querySelectorAll("[data-open-task]").forEach(b=>b.onclick=()=>openTask(b.dataset.openTask));if(selectedTask)await openTask(selectedTask);
  }
  async function openTask(taskId){
    selectedTask=taskId;const [sessions,deliveryPreview,deliveryHistory,mandates,handover]=await Promise.all([json(`/api/work-items/${encodeURIComponent(taskId)}/assistant/sessions`),json(`/api/work-items/${encodeURIComponent(taskId)}/delivery-preview`),json(`/api/work-items/${encodeURIComponent(taskId)}/deliveries`),json(`/api/work-items/${encodeURIComponent(taskId)}/mandates`),json(`/api/work-items/${encodeURIComponent(taskId)}/handover?include_projection=true&detail_page=${taskPage}`)]);if(selectedTask!==taskId)return;const data=handover.detail,projection=handover.projection;taskPages=data.invoices.pages||1;const task=data.task;const companySettings=await json(`/api/companies/${encodeURIComponent(task.company_id)}`);if(selectedTask!==taskId)return;const accountant=canAccount(task.company_id),reviewer=canReview(task.company_id),canExport=task.status==="closed"&&(accountant||reviewer);
    const rows=data.invoices.items.map(i=>`<tr><td><input type="checkbox" data-target="${h(i.invoice_id)}" ${accountant&&i.source_status!=="void"?"":"disabled"}></td><td>${h(i.source_system)} / ${h(i.source_invoice_id)}</td><td>${h(i.issue_date)}</td><td>${h(i.seller_name)}</td><td>${h(i.project_name)}</td><td>${h(i.amount_text)} ${h(i.currency)}</td><td><div>用途：${h(i.purpose||"（空）")}</div><div>备注：${h(i.remarks||"（空）")}</div>${Object.entries(i.review_changes||{}).map(([field,change])=>`<div class="muted">${field==="purpose"?"用途":"备注"}原为：${h(change.before||"（空）")}</div>`).join("")}${reviewEvidence(i)}</td><td><span class="status">${h(i.source_status==="void"?"已作废":taskStatusLabel[i.task_status]||i.task_status)}</span></td><td>${reviewer&&i.source_status!=="void"&&i.task_status==="awaiting_review"?`<button class="secondary" data-review="approve" data-invoice="${h(i.invoice_id)}" data-review-token="${h(i.review_token||"")}">通过</button> <button class="danger" data-review="return" data-invoice="${h(i.invoice_id)}" data-review-token="${h(i.review_token||"")}">退回</button>`:""}${reviewer&&i.source_status!=="void"&&["pending","returned"].includes(i.task_status)&&i.purpose?`<button class="secondary" data-review="approve" data-invoice="${h(i.invoice_id)}" data-review-token="${h(i.review_token||"")}">复核现有用途</button>`:""}${reviewer&&i.source_status!=="void"&&companySettings.allowed_dispositions.includes("waive_missing")&&["pending","awaiting_info","returned"].includes(i.task_status)&&!i.purpose?`<label>处置原因<input data-waive-reason="${h(i.invoice_id)}" placeholder="说明无法补充的原因"></label><button class="secondary" data-review="waive" data-invoice="${h(i.invoice_id)}" data-review-token="${h(i.review_token||"")}">按授权处置</button>`:""}</td></tr>`).join("");
    const draftRefs=d=>d.invoice_refs||[];const draftRevisions=Object.fromEntries(data.drafts.map(d=>[d.draft_id,d.draft_revision]));
    const draftEvidence=(d,field)=>{const c=d.field_context?.[field]||{},source=c.evidence_source||{};return `${field==="purpose"?"用途":"备注"}依据：${h(c.evidence_quote||d.evidence_quote)}${source.type==="source_document"?` <a target="_blank" rel="noopener" href="/api/source-documents/${encodeURIComponent(source.document_id)}/original">查看导入原件</a>`:""}${source.type==="reply_attachment"?` <a target="_blank" rel="noopener" href="/api/attachments/${encodeURIComponent(source.attachment_id)}/original">查看附件第 ${h(source.page)} 页</a>${source.verification==="recognized_text"?' <span class="warn">图片识别候选，请核对原件</span>':""}`:""}`};
    const drafts=data.drafts.map(d=>{
      const choices=draftRefs(d).map(ref=>`<option value="${h(ref.invoice_id)}" ${ref.invoice_id===d.invoice_id?"selected":""}>${h(ref.source_system)} / ${h(ref.source_invoice_id)} · ${h(ref.seller_name)} · ${h(ref.project_name)}</option>`).join("");
      const editable=accountant&&!['superseded','confirmed','rejected'].includes(d.status),sourceConflict=d.field_context?._conflict_reason?.kind==="source_status";
      const ready=Object.entries(d.field_states||{}).filter(([,value])=>value.state==="ready").map(([field])=>field);
      const selectable=editable&&!sourceConflict&&!d.needs_clarification&&!d.unavailable&&!projection.excluded.includes(d.invoice_id)&&ready.length;

    $("scanColumns").onclick=async()=>{try{const fd=new FormData(form);fd.append("company_id",companyId);const r=await api("/api/invoices/import/columns",{method:"POST",body:fd});importScan=await r.json();const headers=importScan.headers;$("importMapping").innerHTML=`<div class="panel"><h3>确认列对应关系</h3><p class="muted">系统已按表头自动识别；如有不同，请从下列选项更正。带 * 的项目必填。</p><div class="grid">${fields.map(([key,label,required])=>`<label>${h(label)}${required?" *":""}<select data-map="${h(key)}"><option value="">${required?"请选择文件列":"不映射"}</option>${headers.map(header=>`<option value="${h(header)}" ${importScan.suggested_mapping[key]===header?"selected":""}>${h(header)}</option>`).join("")}</select></label>`).join("")}</div><button type="button" id="validateImport">预览有效行</button></div>`;$("validateImport").onclick=async()=>{try{const mapping={};document.querySelectorAll("[data-map]").forEach(select=>{if(select.value)mapping[select.dataset.map]=select.value});for(const key of ["source_invoice_id","issue_date","amount"]){if(!mapping[key])throw new Error("请为来源单据编号、日期和票面总额选择文件列。")}const upload=new FormData(form);upload.append("company_id",companyId);upload.append("mapping_json",JSON.stringify(mapping));const response=await api("/api/invoices/import/preview",{method:"POST",body:upload});importPreview=await response.json();showPreview()}catch(e){toast(e.message,true)}}}catch(e){toast(e.message,true)}};
    async function showPreview(){const p=importPreview;$("importPreview").innerHTML=`<div class="note">${h(p.filename)} · ${h(p.accepted_rows)} 行可导入 · ${h(p.issue_count)} 行需人工处理</div><p>用途和备注：${p.source_policy.mode==="trusted_sync"?"授权来源自动同步，之后仍需复核":"导入后进入会计确认"}。</p>${p.issues.map(i=>`<p class="warn">第 ${h(i.row_number)} 行 · ${h(i.source_invoice_id)}：${h(i.details)}</p>`).join("")}<details><summary>来源技术信息</summary><p class="muted">文件摘要：${h(p.file_hash)} · 映射：${h(JSON.stringify(p.mapping))}</p></details><button id="commitImport" ${p.accepted_rows?"":"disabled"}>确认导入有效行</button>`;$("commitImport").onclick=async()=>{try{const result=await json(`/api/imports/${encodeURIComponent(p.preview_id)}/commit`,{method:"POST",body:"{}"});const auto=result.automatic_confirmation,waiting=result.counts.proposals+(result.counts.retry_proposals||0)-(auto?.confirmed||0);if(auto?.status==="interrupted")toast(auto.summary,true);else toast(`导入完成：新增 ${result.counts.inserted}，更新 ${result.counts.updated}，待会计确认 ${waiting}，冲突 ${result.counts.conflicts}，异常 ${result.issues.length}。${auto?.confirmed?`已同步 ${auto.confirmed} 条，请到工作清单查看。`:""}`);importPreview=null;await renderImportComplete()}catch(e){toast(e.message,true)}}}
    const conflictData=await json(`/api/imports/conflicts?company_id=${encodeURIComponent(companyId)}`);$("conflicts").innerHTML=conflictData.items.map(c=>`<div class="card"><b>${h(c.field_name==="purpose"?"用途":"备注")}</b> · 当前值：${h(c.live_value||"（空）")} · 新来源值：${h(c.incoming_source_value||"（空）")}${c.live_value!==c.current_value?`<div class="warn">发现冲突时原值：${h(c.current_value||"（空）")}；当前内容已有变化。</div>`:""}<div class="row"><button data-resolve="keep_local" data-id="${h(c.conflict_id)}" data-revision="${h(c.current_revision)}" class="secondary">保留当前值</button><button data-resolve="accept_source" data-id="${h(c.conflict_id)}" data-revision="${h(c.current_revision)}">采用来源</button></div></div>`).join("")||'<p class="muted">没有待处理冲突。</p>';document.querySelectorAll("[data-resolve]").forEach(b=>b.onclick=async()=>{try{const r=await json(`/api/imports/conflicts/${encodeURIComponent(b.dataset.id)}/resolve`,{method:"POST",body:body({resolution:b.dataset.resolve,expected_revision:Number(b.dataset.revision)})});if(!["resolved","already_resolved"].includes(r.status)){toast(r.summary||"来源内容尚未保存，请查看待处理草稿。",true);return}toast("冲突已处理。");await renderImportComplete()}catch(e){toast(e.message,true)}})
    await renderIdentityPanel();
  }
  async function renderPreferencesComplete(){
    const view=$("view-preferences");
    const [data,catalogResult]=await Promise.all([
      json(`/api/preferences${companyId?`?company_id=${encodeURIComponent(companyId)}`:""}`),
      json("/api/preferences/catalog")
    ]);
    const catalog=catalogResult.items,byKey=Object.fromEntries(catalog.map(item=>[item.key,item]));
    const valueOptions=(key,current)=>((byKey[key]?.values)||[]).map(v=>`<option value="${h(v.value)}" ${v.value===current?"selected":""}>${h(v.label)}</option>`).join("");
    const valueLabel=(key,value)=>byKey[key]?.values.find(v=>v.value===value)?.label||value;
    view.innerHTML=`<div><h1>个人表达偏好</h1><p class="muted">偏好只影响回复表达，不改变企业权限或业务数据。选项来自系统支持目录。</p></div>
      <div class="panel"><form id="prefForm"><div class="grid"><label>偏好项<select name="key" id="prefKey">${catalog.map(item=>`<option value="${h(item.key)}">${h(item.label)}</option>`).join("")}</select></label><label>偏好值<select name="value" id="prefValue"></select></label><label>作用范围<select name="scope"><option value="user">个人所有企业</option><option value="company">当前企业</option></select></label></div><button>保存偏好</button></form></div>
      <div class="panel stack"><h3>已保存偏好</h3>${data.preferences.map(p=>`<div class="card"><div><b>${h(byKey[p.key]?.label||p.key)}</b>：${h(valueLabel(p.key,p.value))} · ${h(p.scope)} ${p.company_id?`(${h(p.company_id)})`:""}</div><div class="row"><label>更正为<select data-pref-value="${h(p.preference_id)}">${valueOptions(p.key,p.value)}</select></label><button class="secondary" data-pref-update="${h(p.preference_id)}" data-revision="${h(p.revision)}">更正</button><button class="danger" data-pref-delete="${h(p.preference_id)}" data-revision="${h(p.revision)}">删除</button></div></div>`).join("")||'<p class="muted">暂无偏好。</p>'}</div>`;
    const refreshValues=()=>{$("prefValue").innerHTML=valueOptions($("prefKey").value)};
    $("prefKey").onchange=refreshValues;refreshValues();
    $("prefForm").onsubmit=async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.currentTarget).entries());if(f.scope==="company")f.company_id=companyId;else delete f.company_id;await json("/api/preferences",{method:"POST",body:body(f)});toast("偏好已保存");renderPreferencesComplete()}catch(e){toast(e.message,true)}};
    document.querySelectorAll("[data-pref-update]").forEach(b=>b.onclick=async()=>{try{const value=document.querySelector(`[data-pref-value="${CSS.escape(b.dataset.prefUpdate)}"]`).value;await json(`/api/preferences/${b.dataset.prefUpdate}`,{method:"PUT",body:body({value,expected_revision:Number(b.dataset.revision)})});toast("偏好已更正");renderPreferencesComplete()}catch(e){toast(e.message,true)}});
    document.querySelectorAll("[data-pref-delete]").forEach(b=>b.onclick=async()=>{try{await json(`/api/preferences/${b.dataset.prefDelete}?expected_revision=${b.dataset.revision}`,{method:"DELETE",body:"{}"});toast("偏好已删除");renderPreferencesComplete()}catch(e){toast(e.message,true)}})
  }
  async function renderAdmin(){const view=$("view-admin");if(!user.is_admin){view.innerHTML='<div class="panel">账号与企业管理仅管理员可用。会计/复核人员可在规则、偏好和工作清单页面操作授权范围内的功能。</div>';return}const [allCompanies,users]=await Promise.all([json("/api/companies"),json("/api/admin/users")]);view.innerHTML=`<h1>企业与账号授权</h1><div class="split"><div class="panel"><h3>新建企业</h3><form id="companyForm"><label>企业名称<input name="name" required></label><label>默认币种<select name="default_currency"><option>CNY</option><option>GBP</option><option>USD</option><option>EUR</option></select></label><label><span><input type="checkbox" name="require_independent_review" checked>要求独立复核</span></label><button>创建企业</button></form><h3>设置默认策略/处置</h3><form id="settingsForm"><label>办理企业<select name="company_id">${allCompanies.items.map(c=>`<option value="${h(c.company_id)}">${h(c.name)}</option>`).join("")}</select></label><label>无当前规则时的内部默认<select name="default_purpose_policy"><option value="all_blank">空用途列入人工核实</option><option value="none">不自动判定</option></select></label><label>默认币种<select name="default_currency"><option>CNY</option><option>GBP</option><option>USD</option><option>EUR</option></select></label><label><span><input type="checkbox" name="require_independent_review" checked>要求独立复核</span></label><label><span><input type="checkbox" name="allow_waive">允许复核人明确批准“无法补充”保留空值</span></label><button class="secondary">保存企业设置</button></form></div><div class="panel"><h3>新建账号</h3><form id="userForm"><label>登录账号<input name="username" required></label><label>显示名称<input name="display_name" required></label><label>初始密码（至少 12 字符）<input name="password" type="password" required minlength="12"></label><label><span><input name="is_admin" type="checkbox">系统管理员</span></label><button>创建账号</button></form><h3>分配企业角色</h3><form id="memberForm"><label>账号<select name="user_id">${[...new Map(users.items.map(u=>[u.user_id,u])).values()].map(u=>`<option value="${h(u.user_id)}">${h(u.display_name)} · ${h(u.username)}</option>`).join("")}</select></label><label>企业<select name="company_id">${allCompanies.items.map(c=>`<option value="${h(c.company_id)}">${h(c.name)}</option>`).join("")}</select></label><label>角色<select name="role"><option value="accountant">会计</option><option value="reviewer">复核</option><option value="requester">经办人</option></select></label><label><span><input name="active" type="checkbox" checked>启用此企业授权</span></label><button>保存授权</button></form></div></div><div class="panel tablewrap"><h3>账号清单</h3><table><thead><tr><th>账号</th><th>姓名</th><th>系统管理员</th><th>企业</th><th>角色</th><th>状态</th><th></th></tr></thead><tbody>${users.items.map(u=>`<tr><td>${h(u.username)}</td><td>${h(u.display_name)}</td><td>${u.is_admin?'是':'否'}</td><td>${h(u.company_name||'—')}</td><td>${h(u.role||'—')}</td><td>${u.active?'启用':'停用'}</td><td><button class="secondary" data-user="${h(u.user_id)}" data-active="${u.active?0:1}">${u.active?'停用':'启用'}</button></td></tr>`).join("")}</tbody></table></div>`;
    $("companyForm").onsubmit=async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.currentTarget).entries());f.require_independent_review=e.currentTarget.querySelector('[name=require_independent_review]').checked;const c=await json("/api/companies",{method:"POST",body:body(f)});toast(`企业已创建：${c.company_id}`);const state=await json("/api/session");csrf=state.csrf_token;companies=state.companies;enter();renderAdmin()}catch(e){toast(e.message,true)}};
    $("settingsForm").onsubmit=async e=>{e.preventDefault();try{const form=e.currentTarget,f=Object.fromEntries(new FormData(form).entries());f.require_independent_review=form.querySelector('[name=require_independent_review]').checked;f.allowed_dispositions=form.querySelector('[name=allow_waive]').checked?["waive_missing"]:[];await json(`/api/companies/${encodeURIComponent(f.company_id)}/settings`,{method:"PUT",body:body(f)});toast("企业策略已更新");renderAdmin()}catch(e){toast(e.message,true)}};
    $("userForm").onsubmit=async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.currentTarget).entries());f.is_admin=e.currentTarget.querySelector('[name=is_admin]').checked;const u=await json("/api/admin/users",{method:"POST",body:body(f)});toast(`账号已创建：${u.username}`);renderAdmin()}catch(e){toast(e.message,true)}};
    $("memberForm").onsubmit=async e=>{e.preventDefault();try{await json("/api/admin/membership",{method:"PUT",body:body({...Object.fromEntries(new FormData(e.currentTarget).entries()),active:e.currentTarget.querySelector('[name=active]').checked})});toast("企业授权已更新");renderAdmin()}catch(e){toast(e.message,true)}};document.querySelectorAll("[data-user]").forEach(b=>b.onclick=async()=>{try{await json(`/api/admin/users/${b.dataset.user}`,{method:"PATCH",body:body({active:b.dataset.active==='1'})});renderAdmin()}catch(e){toast(e.message,true)}})
  }
  async function renderDiagnostics(){const view=$("view-diagnostics");if(!user.is_admin){view.innerHTML='<div class="panel">诊断与备份仅系统管理员可见。</div>';return}const d=await json("/api/diagnostics");view.innerHTML=`<div class="between"><div><h1>诊断与备份</h1><p class="muted">实时模型调用：${h(d.live_provider_call?'已发生':'本页面未发起')} · 预算状态：${h(d.budget.status||'未配置')}</p></div><button id="backupNow">备份工作台与对话资料</button></div><div class="panel"><p>企业数据库：${h(d.database_path)}</p><p>Schema：${h(d.schema_version)}</p><p>预算：${h(JSON.stringify(d.budget))}</p><pre>${h(JSON.stringify(d.counts,null,2))}</pre><pre>${h(JSON.stringify(d.work_item_statuses,null,2))}</pre></div><div id="backupResult"></div>`;$("backupNow").onclick=async()=>{try{const b=await json("/api/admin/backup",{method:"POST",body:"{}"});$("backupResult").innerHTML=`<div class="panel note">备份完成：${h(b.path)}。${b.missing_legacy_attachments.length?`有 ${h(b.missing_legacy_attachments.length)} 个历史附件未找到，请检查原始文件。`:"包含企业数据、现有对话和可用附件。"} 各数据库分别生成快照；共享模型费用账本需单独保管。</div>`}catch(e){toast(e.message,true)}}}
  start();
})();
</script>
